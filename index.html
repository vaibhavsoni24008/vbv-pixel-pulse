<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Glint — find the picture in your head</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <header class="site-header">
    <div class="header-inner">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"></span>
        <div class="brand-text">
          <span class="brand-name">Glint</span>
          <span class="brand-tagline">Find the picture in your head.</span>
        </div>
      </div>
    </div>
  </header>

  <main>
    <section class="search-section" aria-label="Image search">
      <form id="search-form" class="search-form">
        <div class="search-row">
          <label for="search-input" class="visually-hidden">Search for images</label>
          <input
            type="search"
            id="search-input"
            name="q"
            class="search-input"
            placeholder="Try “foggy harbor at dawn”…"
            autocomplete="off"
          />
          <button type="button" id="clear-button" class="clear-button" aria-label="Clear search input">
            Clear
          </button>
          <button type="submit" id="search-button" class="search-button">
            Search
          </button>
        </div>
      </form>

      <div class="chip-row" role="group" aria-label="Quick pick categories">
        <button type="button" class="chip" id="chip-nature">Nature</button>
        <button type="button" class="chip" id="chip-cities">Cities</button>
        <button type="button" class="chip" id="chip-animals">Animals</button>
      </div>
    </section>

    <section class="results-section" aria-label="Search results">
      <p id="result-count" class="result-count">Showing 0 results</p>

      <div id="results" class="results-grid">
        <p id="empty-state" class="empty-state">Search to see results</p>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <p>Glint — a small search for whatever you're picturing.</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
